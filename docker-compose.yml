# GraphFlow local infrastructure.
#
#   Infra only (recommended for development):
#     docker compose up -d postgres redis
#
#   Full stack (app + worker + migrations in containers):
#     docker compose --profile full up -d --build
#
name: graphflow

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgresql://graphflow_app:${APP_DB_PASSWORD:-graphflow_app_dev_password}@postgres:5432/graphflow?schema=public
  MIGRATION_DATABASE_URL: postgresql://graphflow:${POSTGRES_PASSWORD:-graphflow_dev_password}@postgres:5432/graphflow?schema=public
  REDIS_URL: redis://redis:6379
  APP_URL: ${APP_URL:-http://localhost:3000}
  SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production-at-least-32-characters}
  DEMO_MODE: ${DEMO_MODE:-true}
  WORKER_HEALTH_PORT: "9100"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: graphflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-graphflow_dev_password}
      POSTGRES_DB: graphflow
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-graphflow_app_dev_password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graphflow -d graphflow"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    profiles: ["full"]
    build: .
    command: ["npx", "prisma", "migrate", "deploy"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy

  app:
    profiles: ["full"]
    build: .
    restart: unless-stopped
    command: ["node", "server.js"]
    environment: *app-env
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  worker:
    profiles: ["full"]
    build: .
    restart: unless-stopped
    command: ["npx", "tsx", "src/workers/index.ts"]
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9100/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
